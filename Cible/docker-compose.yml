services:
  web:
    build: .
    container_name: lab_cible
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: lab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ctf_db
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: lab_adminer
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  db_data: